sentence=Easy button library: debounce, click, double click, long press and hold-repeat without delay(). Many buttons, clear tips, no dependencies.
paragraph=Reads push buttons on any pin with a short code: clicked(), doubleClicked(), longPressed(), repeat(). Removes contact bounce, never blocks the program, supports internal pull-up or pull-down, optional callbacks, and explains wiring problems in Russian, Kazakh or English. Works on Arduino AVR, ESP32, ESP8266 and other boards. Examples included, made for classes and kits by Alash Electronics.
